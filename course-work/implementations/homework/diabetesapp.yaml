  /api/InsulinEntries:
    get:
      tags: [InsulinEntries]
      summary: List insulin doses (paginated, with filters)
      description: >
        Returns a paginated list of insulin injection records.
        Supports filtering by insulin type, date range, and number of units.
      operationId: InsulinEntries_GetAll
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: Filters.CurrentUserId
          in: query
          description: Filter by user ID.
          schema:
            type: integer
            format: int32
        - name: Filters.Type
          in: query
          description: Filter by insulin type (e.g. 'Bolus', 'Basal', 'NovoRapid').
          schema:
            type: string
            example: Bolus
        - name: Filters.FromDate
          in: query
          description: Start date filter.
          schema:
            type: string
            format: date-time
        - name: Filters.ToDate
          in: query
          description: End date filter.
          schema:
            type: string
            format: date-time
        - name: Filters.MinUnits
          in: query
          description: Minimum number of insulin units.
          schema:
            type: number
            format: double
            minimum: 0
        - name: Filters.MaxUnits
          in: query
          description: Maximum number of insulin units.
          schema:
            type: number
            format: double
            minimum: 0
      responses:
        '200':
          description: Successfully returned list of insulin dose records.
