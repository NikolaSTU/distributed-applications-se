components:

  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT Bearer authentication. Obtain a token via `/api/Auth/login` or `/api/Auth/register`
        and send it in the header: `Authorization: Bearer <token>`.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Unique numeric identifier of the resource.
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 1

    PageNumber:
      name: PageNumber
      in: query
      description: Page number for pagination (starts at 1).
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
        example: 1

    PageSize:
      name: PageSize
      in: query
      description: Number of results per page (maximum 100).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
        example: 20

  responses:
    BadRequest:
      description: Invalid input data. Check the validation errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    Unauthorized:
      description: JWT token is missing or has expired. Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unauthorized. Please log in to access this resource.

    Forbidden:
      description: You do not have permission to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Access denied.

    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Resource not found.

  schemas:

    UserRegisterDTO:
      type: object
      description: Registration data for a new user account.
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Unique username. Between 3 and 50 characters.
          minLength: 3
          maxLength: 50
          example: john_doe
        password:
          type: string
          description: >
            Password. Minimum 8 characters; must contain at least one uppercase letter,
            one digit, and one special character.
          minLength: 8
          format: password
          example: S3cur3P@ssw0rd!
      additionalProperties: false

    UserLoginDTO:
      type: object
      description: Login credentials.
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username.
          example: john_doe
        password:
          type: string
          description: Password.
          format: password
          example: S3cur3P@ssw0rd!
      additionalProperties: false

    AuthResponseDTO:
      type: object
      description: Response returned on successful authentication.
      properties:
        token:
          type: string
          description: JWT Bearer token to be used in subsequent requests.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        userId:
          type: integer
          format: int32
          description: ID of the authenticated user.
          example: 42
        username:
          type: string
          description: Username.
          example: john_doe

    UserUpdateDTO:
      type: object
      description: >
        Data for creating or updating a user's diabetes profile.
        ICR and ISF are the key parameters used to calculate the insulin dose.
      properties:
        username:
          type: string
          description: Username.
          minLength: 3
          maxLength: 50
          example: john_doe
        userId:
          type: integer
          format: int32
          nullable: true
          description: ID of the linked user account.
          example: 42
        icr:
          type: number
          format: double
          description: >
            Insulin-to-Carb Ratio. For example, a value of 10 means 1 unit of insulin
            per 10 g of carbohydrates. Valid range: 1.0–100.0.
          minimum: 1.0
          maximum: 100.0
          example: 10.0
        isf:
          type: number
          format: double
          description: >
            Insulin Sensitivity Factor. Indicates by how many mmol/L blood glucose drops
            per 1 unit of insulin. Valid range: 0.5–20.0.
          minimum: 0.5
          maximum: 20.0
          example: 2.5
        targetGlucose:
          type: number
          format: double
          description: >
            Target blood glucose in mmol/L. Used to calculate the correction dose.
            Standard target range: 4.0–7.0 mmol/L.
          minimum: 3.0
          maximum: 15.0
          example: 5.5
      additionalProperties: false

    UserResponseDTO:
      type: object
      description: User profile including diabetes parameters.
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier of the profile.
          example: 1
        userId:
          type: integer
          format: int32
          nullable: true
          description: ID of the linked user account.
          example: 42
        username:
          type: string
          description: Username.
          example: john_doe
        icr:
          type: number
          format: double
          description: Insulin-to-Carb Ratio.
          example: 10.0
        isf:
          type: number
          format: double
          description: Insulin Sensitivity Factor (mmol/L per unit).
          example: 2.5
        targetGlucose:
          type: number
          format: double
          description: Target blood glucose in mmol/L.
          example: 5.5
      additionalProperties: false

    UserResponseDTOPagedResult:
      type: object
      description: Paginated list of user profiles.
      allOf:
        - $ref: '#/components/schemas/PagedResultBase'
        - type: object
          properties:
            items:
              type: array
              description: List of user profiles for the current page.
              items:
                $ref: '#/components/schemas/UserResponseDTO'
              nullable: true
      additionalProperties: false

    FoodCreateUpdateDTO:
      type: object
      description: Data for creating or updating a food item.
      required:
        - name
        - carbPer100g
        - proteinPer100g
        - fatPer100g
        - glycemicIndex
      properties:
        userId:
          type: integer
          format: int32
          nullable: true
          description: ID of the owning user. When null the item is global (available to all users).
          example: 42
        name:
          type: string
          description: Name of the food item. Maximum 200 characters.
          minLength: 1
          maxLength: 200
          example: White Bread
        carbPer100g:
          type: number
          format: double
          description: Carbohydrates in grams per 100 g of product. Must be >= 0.
          minimum: 0
          maximum: 100
          example: 49.0
        proteinPer100g:
          type: number
          format: double
          description: Protein in grams per 100 g of product. Must be >= 0.
          minimum: 0
          maximum: 100
          example: 8.0
        fatPer100g:
          type: number
          format: double
          description: Fat in grams per 100 g of product. Must be >= 0.
          minimum: 0
          maximum: 100
          example: 3.0
        glycemicIndex:
          type: number
          format: double
          description: Glycemic index (0–100). Values above 70 are considered high.
          minimum: 0
          maximum: 100
          example: 75.0
      additionalProperties: false

    FoodResponseDTO:
      type: object
      description: Food item with full macronutrient data.
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier of the food item.
          example: 1
        userId:
          type: integer
          format: int32
          nullable: true
          description: ID of the owner. Null indicates a global item.
          example: null
        name:
          type: string
          description: Name of the food item.
          example: White Bread
        carbPer100g:
          type: number
          format: double
          description: Carbohydrates (g) per 100 g.
          example: 49.0
        proteinPer100g:
          type: number
          format: double
          description: Protein (g) per 100 g.
          example: 8.0
        fatPer100g:
          type: number
          format: double
          description: Fat (g) per 100 g.
          example: 3.0
        glycemicIndex:
          type: number
          format: double
          description: Glycemic index (0–100).
          example: 75.0
        caloriesPer100g:
          type: number
          format: double
          description: Calories per 100 g (calculated automatically).
          example: 259.0
      additionalProperties: false

    FoodResponseDTOPagedResult:
      type: object
      description: Paginated list of food items.
      allOf:
        - $ref: '#/components/schemas/PagedResultBase'
        - type: object
          properties:
            items:
              type: array
              description: List of food items for the current page.
              items:
                $ref: '#/components/schemas/FoodResponseDTO'
              nullable: true
      additionalProperties: false

    FoodEntryCreateUpdateDTO:
      type: object
      description: Data for adding a food item to a meal.
      required:
        - foodId
        - mealEntryId
        - weigth
      properties:
        userId:
          type: integer
          format: int32
          nullable: true
          description: User ID. When null the currently authenticated user is used.
          example: 42
        foodId:
          type: integer
          format: int32
          description: ID of the food item. Must exist in the database.
          minimum: 1
          example: 1
        mealEntryId:
          type: integer
          format: int32
          description: ID of the meal to which the food item is added. Must exist.
          minimum: 1
          example: 7
        weigth:
          type: number
          format: double
          description: Weight of the food item in grams. Must be > 0.
          minimum: 0.1
          maximum: 5000
          example: 120.0
      additionalProperties: false

    FoodEntryResponseDTO:
      type: object
      description: Food entry with calculated macronutrients for the specific weight.
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier of the entry.
          example: 15
        userId:
          type: integer
          format: int32
          nullable: true
          example: 42
        foodId:
          type: integer
          format: int32
          description: ID of the food item.
          example: 1
        mealEntryId:
          type: integer
          format: int32
          description: ID of the associated meal.
          example: 7
        weigth:
          type: number
          format: double
          description: Weight in grams.
          example: 120.0
        carbs:
          type: number
          format: double
          description: Calculated carbohydrates (g) for the specified weight.
          example: 58.8
        protein:
          type: number
          format: double
          description: Calculated protein (g) for the specified weight.
          example: 9.6
        fat:
          type: number
          format: double
          description: Calculated fat (g) for the specified weight.
          example: 3.6
        calories:
          type: number
          format: double
          description: Calculated calories for the specified weight.
          example: 310.8
      additionalProperties: false

    FoodEntryResponseDTOPagedResult:
      type: object
      description: Paginated list of food entries.
      allOf:
        - $ref: '#/components/schemas/PagedResultBase'
        - type: object
          properties:
            items:
              type: array
              description: List of food entries for the current page.
              items:
                $ref: '#/components/schemas/FoodEntryResponseDTO'
              nullable: true
      additionalProperties: false

    MealEntryCreateUpdateDTO:
      type: object
      description: Data for creating or updating a meal record.
      required:
        - name
      properties:
        userId:
          type: integer
          format: int32
          nullable: true
          description: User ID. When null the currently authenticated user is used.
          example: 42
        name:
          type: string
          description: Name of the meal (e.g. "Breakfast", "Lunch", "Dinner"). Maximum 200 characters.
          minLength: 1
          maxLength: 200
          example: Wednesday Lunch
      additionalProperties: false

    MealEntryResponseDTO:
      type: object
      description: Meal record with automatically calculated total nutritional values.
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier of the meal record.
          example: 7
        userId:
          type: integer
          format: int32
          nullable: true
          example: 42
        name:
          type: string
          description: Name of the meal.
          example: Wednesday Lunch
        totalCarb:
          type: number
          format: double
          description: Total carbohydrates (g) for the entire meal — sum of all FoodEntry records.
          example: 65.4
        totalProtein:
          type: number
          format: double
          description: Total protein (g) for the entire meal.
          example: 22.1
        totalFat:
          type: number
          format: double
          description: Total fat (g) for the entire meal.
          example: 14.8
        totalCalories:
          type: number
          format: double
          description: Total calories for the entire meal.
          example: 479.2
        createdAt:
          type: string
          format: date-time
          description: Date and time the record was created (UTC).
          example: '2025-06-15T12:30:00Z'
      additionalProperties: false

    MealEntryResponseDTOPagedResult:
      type: object
      description: Paginated list of meal records.
      allOf:
        - $ref: '#/components/schemas/PagedResultBase'
        - type: object
          properties:
            items:
              type: array
              description: List of meal records for the current page.
              items:
                $ref: '#/components/schemas/MealEntryResponseDTO'
              nullable: true
      additionalProperties: false

    GlucoseEntryCreateUpdateDTO:
      type: object
      description: Data for recording a blood glucose measurement.
      required:
        - value
        - measuredAt
      properties:
        userId:
          type: integer
          format: int32
          nullable: true
          description: User ID. When null the currently authenticated user is used.
          example: 42
        value:
          type: number
          format: double
          description: Blood glucose value in mmol/L. Must be in the range 1.0–30.0.
          minimum: 1.0
          maximum: 30.0
          example: 8.3
        source:
          type: string
          description: >
            Source of the measurement. Recommended values: 'Manual', 'CGM', 'Laboratory'.
          maxLength: 100
          nullable: true
          example: Manual
        measuredAt:
          type: string
          format: date-time
          description: Date and time of the measurement (UTC). Cannot be in the future.
          example: '2025-06-15T12:00:00Z'
        note:
          type: string
          description: Additional note (e.g. "Before meal", "After exercise"). Maximum 500 characters.
          maxLength: 500
          nullable: true
          example: Before lunch
      additionalProperties: false

    GlucoseEntryResponseDTO:
      type: object
      description: Blood glucose measurement record.
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier of the record.
          example: 33
        userId:
          type: integer
          format: int32
          nullable: true
          example: 42
        value:
          type: number
          format: double
          description: Blood glucose value in mmol/L.
          example: 8.3
        source:
          type: string
          description: Source of the measurement.
          nullable: true
          example: Manual
        measuredAt:
          type: string
          format: date-time
          description: Date and time of the measurement (UTC).
          example: '2025-06-15T12:00:00Z'
        note:
          type: string
          description: Note attached to the measurement.
          nullable: true
          example: Before lunch
      additionalProperties: false

    GlucoseEntryResponseDTOPagedResult:
      type: object
      description: Paginated list of blood glucose measurements.
      allOf:
        - $ref: '#/components/schemas/PagedResultBase'
        - type: object
          properties:
            items:
              type: array
              description: List of measurements for the current page.
              items:
                $ref: '#/components/schemas/GlucoseEntryResponseDTO'
              nullable: true
      additionalProperties: false

    InsulinEntryCreateUpdateDTO:
      type: object
      description: Data for recording an insulin dose.
      required:
        - units
        - injectedAt
      properties:
        userId:
          type: integer
          format: int32
          nullable: true
          description: User ID. When null the currently authenticated user is used.
          example: 42
        units:
          type: number
          format: double
          description: Number of insulin units. Must be > 0 and <= 100.
          minimum: 0.5
          maximum: 100.0
          example: 6.5
        type:
          type: string
          description: >
            Insulin type. Recommended values: 'Bolus' (rapid-acting),
            'Basal' (long-acting), or a brand name (e.g. 'NovoRapid', 'Lantus').
          maxLength: 100
          nullable: true
          example: Bolus
        injectedAt:
          type: string
          format: date-time
          description: Date and time of injection (UTC). Cannot be in the future.
          example: '2025-06-15T12:35:00Z'
        note:
          type: string
          description: Additional note. Maximum 500 characters.
          maxLength: 500
          nullable: true
          example: After lunch
      additionalProperties: false

    InsulinEntryResponseDTO:
      type: object
      description: Record of an injected insulin dose.
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier of the record.
          example: 20
        userId:
          type: integer
          format: int32
          nullable: true
          example: 42
        units:
          type: number
          format: double
          description: Number of insulin units.
          example: 6.5
        type:
          type: string
          description: Insulin type.
          nullable: true
          example: Bolus
        injectedAt:
          type: string
          format: date-time
          description: Date and time of injection (UTC).
          example: '2025-06-15T12:35:00Z'
        note:
          type: string
          description: Note.
          nullable: true
          example: After lunch
      additionalProperties: false

    InsulinEntryResponseDTOPagedResult:
      type: object
      description: Paginated list of insulin dose records.
      allOf:
        - $ref: '#/components/schemas/PagedResultBase'
        - type: object
          properties:
            items:
              type: array
              description: List of insulin dose records for the current page.
              items:
                $ref: '#/components/schemas/InsulinEntryResponseDTO'
              nullable: true
      additionalProperties: false

    PagedResultBase:
      type: object
      description: Base structure for paginated results.
      properties:
        totalCount:
          type: integer
          format: int32
          description: Total number of records matching the applied filters.
          example: 87
        pageNumber:
          type: integer
          format: int32
          description: Current page number.
          example: 1
        pageSize:
          type: integer
          format: int32
          description: Number of records per page.
          example: 20
        totalPages:
          type: integer
          format: int32
          readOnly: true
          description: Total number of pages (calculated automatically).
          example: 5
        hasPreviousPage:
          type: boolean
          readOnly: true
          description: True if there is a previous page.
          example: false
        hasNextPage:
          type: boolean
          readOnly: true
          description: True if there is a next page.
          example: true

    ErrorResponse:
      type: object
      description: Standard error response body.
      properties:
        message:
          type: string
          description: Human-readable description of the error.
          example: Resource not found.
        code:
          type: string
          description: Machine-readable error code (optional).
          nullable: true
          example: RESOURCE_NOT_FOUND

    ValidationErrorResponse:
      type: object
      description: Response body returned when input validation fails.
      properties:
        message:
          type: string
          description: Summary error message.
          example: One or more validation errors occurred.
        errors:
          type: object
          description: Dictionary mapping field names to their validation error messages.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            username:
              - The username must be between 3 and 50 characters.
            password:
              - The password must be at least 8 characters long.
              - The password must contain at least one uppercase letter.


security:
  - Bearer: []