          description: Insulin dose successfully recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsulinEntryResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/InsulinEntries/{id}:
