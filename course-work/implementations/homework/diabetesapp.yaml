openapi: 3.0.4

info:
  title: Diabetes Management API
  version: v1
  description: >
    REST API for diabetes management (Type 1 and Type 2). The system allows users to track
    their meals, blood glucose levels, and insulin doses, as well as receive automatically
    calculated recommended insulin doses based on the Insulin-to-Carb Ratio (ICR) and
    Insulin Sensitivity Factor (ISF).

tags:
  - name: Auth
    description: User authentication and registration
  - name: Users
    description: Management of user profiles with diabetes parameters (ICR, ISF, target blood glucose)
  - name: Foods
    description: Management of the food database with macronutrients and glycemic index
  - name: FoodEntries
    description: Records of specific food items added to a meal, with calculated macronutrients
  - name: MealEntries
    description: Meal records with automatic calculation of the recommended insulin dose
  - name: GlucoseEntries
    description: Blood glucose level records (manual measurements or from a CGM sensor)
  - name: InsulinEntries
    description: Records of injected insulin (bolus or basal)

paths:

  /api/Auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: >
        Creates a new user account. The username must be unique.
        The password is hashed before storage. On successful registration a JWT token
        is returned, allowing the user to immediately start using the API.
      operationId: Auth_Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterDTO'
            example:
              username: john_doe
              password: S3cur3P@ssw0rd!
      responses:
        '201':
          description: User successfully registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                userId: 42
                username: john_doe
        '400':
          description: Invalid input data (e.g. password too short or missing username).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Username already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: A user with that username already exists.

  /api/Auth/login:
    post:
      tags: [Auth]
      summary: Log in to the system
      description: >
        Authenticates an existing user and returns a JWT Bearer token.
        The token must be sent in the `Authorization: Bearer <token>` header
        with all protected requests.
      operationId: Auth_Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginDTO'
            example:
              username: john_doe
              password: S3cur3P@ssw0rd!
      responses:
        '200':
          description: Successful login. Returns a JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                userId: 42
                username: john_doe
        '400':
          description: Required fields are missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Invalid username or password.

  /api/Users:
    get:
      tags: [Users]
      summary: List users (paginated, with filters)
      description: >
        Returns a paginated list of users. Accessible to administrators only.
        Supports filtering by username and email.
      operationId: Users_GetAll
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: Filters.Name
          in: query
          description: Filter by username (partial match, case-insensitive).
          schema:
            type: string
            example: john
        - name: Filters.Email
          in: query
          description: Filter by email address (partial match).
          schema:
            type: string
            format: email
            example: john@example.com
      responses:
        '200':
          description: Successfully returned list of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTOPagedResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Users]
      summary: Create or update a user profile
      description: >
        Creates or updates a user's diabetes profile with the ICR (Insulin-to-Carb Ratio),
        ISF (Insulin Sensitivity Factor), and target blood glucose parameters.
        These values are used when calculating the recommended insulin dose.
      operationId: Users_Create
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateDTO'
            example:
              username: john_doe
              userId: 42
              icr: 10.0
              isf: 2.5
              targetGlucose: 5.5
      responses:
        '201':
          description: Profile successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/Users/{id}:
    get:
      tags: [Users]
      summary: Get a specific user
      description: Returns the full profile of the user, including diabetes parameters (ICR, ISF, targetGlucose).
      operationId: Users_GetById
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Successfully returned user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
              example:
                id: 42
                userId: null
                username: john_doe
                icr: 10.0
                isf: 2.5
                targetGlucose: 5.5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      summary: Update a user profile
      description: >
        Updates the user's diabetes parameters. Changing ICR or ISF will affect
        future insulin dose calculations.
      operationId: Users_Update
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateDTO'
      responses:
        '204':
          description: Profile successfully updated. No response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users]
      summary: Delete a user profile
      description: Deletes the user account and all associated records (meals, glucose, insulin).
      operationId: Users_Delete
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: User successfully deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/Foods:
    get:
      tags: [Foods]
      summary: List food items (paginated, with filters)
      description: >
        Returns a paginated list of food items. Supports filtering by name,
        glycemic index, calories, and carbohydrates.
        Includes both global items and items added by a specific user.
      operationId: Foods_GetAll
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: Filters.CurrentUserId
          in: query
          description: Show only items belonging to the specified user.
          schema:
            type: integer
            format: int32
        - name: Filters.Name
          in: query
          description: Filter by name (partial match, case-insensitive).
          schema:
            type: string
            example: apple
        - name: Filters.MinGlycemicIndex
          in: query
          description: Minimum glycemic index (0–100).
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 100
        - name: Filters.MaxGlycemicIndex
          in: query
          description: Maximum glycemic index (0–100).
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 100
        - name: Filters.MinCalories
          in: query
          description: Minimum calories per 100 g.
          schema:
            type: number
            format: double
            minimum: 0
        - name: Filters.MaxCalories
          in: query
          description: Maximum calories per 100 g.
          schema:
            type: number
            format: double
            minimum: 0
        - name: Filters.MinCarbs
          in: query
          description: Minimum carbohydrates per 100 g.
          schema:
            type: number
            format: double
            minimum: 0
        - name: Filters.MaxCarbs
          in: query
          description: Maximum carbohydrates per 100 g.
          schema:
            type: number
            format: double
            minimum: 0
      responses:
        '200':
          description: Successfully returned list of food items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponseDTOPagedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Foods]
      summary: Add a new food item
      description: >
        Adds a new item to the food database. Calories are calculated automatically
        using the formula: (carbs × 4) + (protein × 4) + (fat × 9).
        Each user may add their own custom food items.
      operationId: Foods_Create
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodCreateUpdateDTO'
            example:
              userId: 42
              name: White Bread
              carbPer100g: 49.0
              proteinPer100g: 8.0
              fatPer100g: 3.0
              glycemicIndex: 75.0
      responses:
        '201':
          description: Food item successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/Foods/{id}:
    get:
      tags: [Foods]
      summary: Get a specific food item
      description: Returns full details of the food item including macronutrients, glycemic index, and calories per 100 g.
      operationId: Foods_GetById
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Successfully returned food item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponseDTO'
              example:
                id: 1
                userId: null
                name: White Bread
                carbPer100g: 49.0
                proteinPer100g: 8.0
                fatPer100g: 3.0
                glycemicIndex: 75.0
                caloriesPer100g: 259.0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Foods]
      summary: Update a food item
      description: Updates the food item data. Allowed only for the owner of the item or an administrator.
      operationId: Foods_Update
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodCreateUpdateDTO'
      responses:
        '204':
          description: Food item successfully updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Foods]
      summary: Delete a food item
      description: Deletes the food item. Only allowed if the item is not referenced by any food entry records.
      operationId: Foods_Delete
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Food item successfully deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The food item cannot be deleted because it is referenced by existing food entry records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/MealEntries:
    get:
      tags: [MealEntries]
      summary: List meal records (paginated, with filters)
      description: >
        Returns a paginated list of the user's meal records. Each meal contains
        the calculated totals for carbohydrates, protein, fat, and calories.
      operationId: MealEntries_GetAll
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: Filters.CurrentUserId
          in: query
          description: Filter by user ID.
          schema:
            type: integer
            format: int32
        - name: Filters.Name
          in: query
          description: Filter by meal name (partial match).
          schema:
            type: string
            example: Lunch
        - name: Filters.FromDate
          in: query
          description: Start date filter (inclusive).
          schema:
            type: string
            format: date-time
            example: '2025-01-01T00:00:00Z'
        - name: Filters.ToDate
          in: query
          description: End date filter (inclusive).
          schema:
            type: string
            format: date-time
            example: '2025-12-31T23:59:59Z'
      responses:
        '200':
          description: Successfully returned list of meal records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealEntryResponseDTOPagedResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [MealEntries]
      summary: Create a new meal record
      description: >
        Creates a new meal record. After food items are added to the meal via
        `/api/FoodEntries`, the system automatically calculates the total macronutrients
        and recommended insulin dose.
      operationId: MealEntries_Create
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealEntryCreateUpdateDTO'
            example:
              userId: 42
              name: Wednesday Lunch
      responses:
        '201':
          description: Meal record successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealEntryResponseDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/MealEntries/{id}:
    get:
      tags: [MealEntries]
      summary: Get a specific meal record
      description: >
        Returns full details of the meal record, including the calculated totals
        for carbohydrates, protein, fat, and calories.
      operationId: MealEntries_GetById
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Successfully returned meal record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealEntryResponseDTO'
              example:
                id: 7
                userId: 42
                name: Wednesday Lunch
                totalCarb: 65.4
                totalProtein: 22.1
                totalFat: 14.8
                totalCalories: 479.2
                createdAt: '2025-06-15T12:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [MealEntries]
      summary: Update a meal record
      description: Updates the name of the meal record.
      operationId: MealEntries_Update
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealEntryCreateUpdateDTO'
      responses:
        '204':
          description: Meal record successfully updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [MealEntries]
      summary: Delete a meal record
      description: Deletes the meal record and all associated food entry records.
      operationId: MealEntries_Delete
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Meal record successfully deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/MealEntries/{id}/dose:
    get:
      tags: [MealEntries]
      summary: Calculate recommended insulin dose for a meal
      description: >
        Calculates the recommended bolus insulin dose for a specific meal based
        on the formula:

        **Dose (units) = Total Carbohydrates (g) ÷ ICR**

        where ICR (Insulin-to-Carb Ratio) is the user's carbohydrate coefficient
        (e.g. ICR = 10 means 1 unit of insulin per 10 g of carbohydrates).

        When the user's current blood glucose is available, a correction dose may also be added:

        **Correction = (Current Blood Glucose − Target Blood Glucose) ÷ ISF**

        **Important:** This value is a recommendation only and does not replace medical advice.
      operationId: MealEntries_GetDose
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Successfully calculated recommended insulin dose in units.
          content:
            application/json:
              schema:
                type: number
                format: double
                description: Recommended insulin dose in units (U).
                example: 6.54
        '400':
          description: The user has no ICR/ISF parameters configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: User ICR and ISF parameters are not configured. Please update your profile.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/FoodEntries:
    get:
      tags: [FoodEntries]
      summary: List food entries (paginated, with filters)
      description: >
        Returns a paginated list of food entries (specific items added to meals).
        Each entry includes the calculated macronutrient values for the specific weight.
      operationId: FoodEntries_GetAll
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: Filters.CurrentUserId
          in: query
          description: Filter by user ID.
          schema:
            type: integer
            format: int32
        - name: Filters.FoodId
          in: query
          description: Filter by food item ID.
          schema:
            type: integer
            format: int32
        - name: Filters.MealEntryId
          in: query
          description: Filter by meal ID — returns all food items in the specified meal.
          schema:
            type: integer
            format: int32
        - name: Filters.FromDate
          in: query
          description: Start date filter.
          schema:
            type: string
            format: date-time
        - name: Filters.ToDate
          in: query
          description: End date filter.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successfully returned list of food entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodEntryResponseDTOPagedResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [FoodEntries]
      summary: Add a food item to a meal
      description: >
        Adds a specific food item with a given weight to a meal.
        Macronutrient values are calculated automatically in proportion to the weight:
        e.g. `carbs = (carbPer100g × weight) / 100`.
        Adding an entry automatically updates the meal's total nutritional values.
      operationId: FoodEntries_Create
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodEntryCreateUpdateDTO'
            example:
              userId: 42
              foodId: 1
              mealEntryId: 7
              weigth: 120.0
      responses:
        '201':
          description: Food entry successfully added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodEntryResponseDTO'
              example:
                id: 15
                userId: 42
                foodId: 1
                mealEntryId: 7
                weigth: 120.0
                carbs: 58.8
                protein: 9.6
                fat: 3.6
                calories: 310.8
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The specified food item or meal does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/FoodEntries/{id}:
    get:
      tags: [FoodEntries]
      summary: Get a specific food entry
      description: Returns full details of the food entry, including calculated macronutrients.
      operationId: FoodEntries_GetById
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Successfully returned food entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodEntryResponseDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [FoodEntries]
      summary: Update a food entry
      description: Updates the weight or associated food item / meal. Macronutrients are recalculated automatically.
      operationId: FoodEntries_Update
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodEntryCreateUpdateDTO'
      responses:
        '204':
          description: Food entry successfully updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [FoodEntries]
      summary: Delete a food entry
      description: Deletes the entry and updates the total nutritional values of the associated meal.
      operationId: FoodEntries_Delete
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Food entry successfully deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'


  /api/GlucoseEntries:
    get:
      tags: [GlucoseEntries]
      summary: List blood glucose measurements (paginated, with filters)
      description: >
        Returns a paginated list of the user's blood glucose measurements.
        Supports filtering by date range, note, source, and maximum value.
      operationId: GlucoseEntries_GetAll
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: Filters.CurrentUserId
          in: query
          description: Filter by user ID.
          schema:
            type: integer
            format: int32
        - name: Filters.Note
          in: query
          description: Search within notes (partial match).
          schema:
            type: string
        - name: Filters.Source
          in: query
          description: Filter by measurement source (e.g. 'CGM', 'Manual').
          schema:
            type: string
            example: CGM
        - name: Filters.MaxValue
          in: query
          description: Maximum blood glucose value (mmol/L).
          schema:
            type: number
            format: double
            minimum: 0
        - name: Filters.FromDate
          in: query
          description: Start date filter.
          schema:
            type: string
            format: date-time
        - name: Filters.ToDate
          in: query
          description: End date filter.
          schema:
            type: string
            format: date-time
      responses:
        '200':
